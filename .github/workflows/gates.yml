name: gates-de-promocao

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas pyyaml pytest
      - name: Testes (MAT, Golden Dataset, Linter, segredos)
        run: python -m pytest -q
      - name: Gates de promocao do Metric Contract
        run: python scripts/run_gates.py metric_contract.yaml
